<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク秘書アシスタント</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .task-form {
            margin-bottom: 20px;
        }
        .task-list {
            list-style: none;
            padding: 0;
        }
        .task-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .resources {
            font-size: 0.9em;
            color: #555;
            margin-top: 5px;
        }
        .execute-btn {
            background-color: #4a6ffd;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        .remove-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>タスク秘書アシスタント</h1>
    <div class="task-form">
        <input type="text" id="task-input" placeholder="タスク内容" />
        <select id="category-input">
            <option value="">カテゴリー選択</option>
            <option value="資料作成">資料作成</option>
            <option value="リサーチ">リサーチ</option>
            <option value="ミーティング">ミーティング</option>
        </select>
        <input type="date" id="due-input" />
        <button onclick="addTask()">追加</button>
    </div>
    <ul id="task-list" class="task-list"></ul>
</div>
<script>
const knowledgeBase = {
    '資料作成': '参考資料を収集し、アウトラインを作成。テンプレートを利用すると効率的です。',
    'リサーチ': 'ウェブ検索や文献調査を行い、必要情報をまとめます。要点をメモして整理しましょう。',
    'ミーティング': '参加者のスケジュールを確認し、アジェンダを準備。議事録のフォーマットも用意しておきます。'
};

let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

function saveTasks() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
}

function renderTasks() {
    const list = document.getElementById('task-list');
    list.innerHTML = '';
    tasks.forEach((t, index) => {
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `<strong>${t.text}</strong> - ${t.category} - 期限: ${t.due || 'なし'}<br>` +
            `<span class="resources">${knowledgeBase[t.category] || '関連情報はありません。'}</span>` +
            `<br><button class="execute-btn" onclick="executeTask(${index})">実行</button>` +
            `<button class="remove-btn" onclick="removeTask(${index})">削除</button>`;
        list.appendChild(li);
    });
}

function addTask() {
    const text = document.getElementById('task-input').value.trim();
    const category = document.getElementById('category-input').value;
    const due = document.getElementById('due-input').value;
    if(!text) return;
    tasks.push({text, category, due});
    saveTasks();
    renderTasks();
    document.getElementById('task-input').value = '';
    document.getElementById('category-input').value = '';
    document.getElementById('due-input').value = '';
}

function removeTask(index) {
    tasks.splice(index,1);
    saveTasks();
    renderTasks();
}

function executeTask(index) {
    alert(`タスク「${tasks[index].text}」を実行します（デモ）。`);
}

renderTasks();
</script>
</body>
</html>
